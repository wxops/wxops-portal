apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: payments-events
  title: Payments Events
  description: Async event stream published by payments-service — payment.created, payment.succeeded, payment.failed, refund.initiated. Consumed by payments-worker for processing and reconciliation.
  tags: [kafka, events, payments, async]
  annotations:
    jira/project-key: PAY
spec:
  type: asyncapi
  lifecycle: production
  owner: group:payments-team
  system: payments
  definition: |
    asyncapi: "2.6.0"
    info:
      title: Payments Events
      version: "1.0.0"
    channels:
      payments.created:
        publish:
          message:
            payload:
              type: object
              properties:
                payment_id: { type: string }
                amount: { type: number }
                currency: { type: string }
      payments.succeeded:
        publish:
          message:
            payload:
              type: object
              properties:
                payment_id: { type: string }
                processed_at: { type: string, format: date-time }
      payments.failed:
        publish:
          message:
            payload:
              type: object
              properties:
                payment_id: { type: string }
                reason: { type: string }
