apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: metrics-api
  title: Metrics API
  description: Prometheus HTTP API for metrics queries and federation. All platform services scrape targets are registered here; portal and dashboarding tools query via PromQL.
  tags: [prometheus, metrics, observability, promql]
  annotations:
    jira/project-key: OBS
spec:
  type: openapi
  lifecycle: production
  owner: group:observability-team
  system: observability
  definition: |
    openapi: "3.0.3"
    info:
      title: Metrics API
      version: "1.0.0"
    paths:
      /api/v1/query:
        get:
          summary: Instant PromQL query
          parameters:
            - name: query
              in: query
              required: true
              schema: { type: string }
            - name: time
              in: query
              schema: { type: string }
          responses:
            "200":
              description: Query result
      /api/v1/query_range:
        get:
          summary: Range PromQL query
          parameters:
            - name: query
              in: query
              required: true
              schema: { type: string }
            - name: start
              in: query
              required: true
              schema: { type: string }
            - name: end
              in: query
              required: true
              schema: { type: string }
            - name: step
              in: query
              required: true
              schema: { type: string }
          responses:
            "200":
              description: Range result
      /federate:
        get:
          summary: Prometheus federation endpoint
          responses:
            "200":
              description: Federated metrics in text format
