user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Log format — [nginx] prefix aligns with [backend] and [frontend] in container logs.
    log_format portal '[$time_local] [nginx] $request_method $uri $status ${body_bytes_sent}b ${request_time}s';
    access_log /dev/stdout portal;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;
    gzip on;

    # When nginx is behind a TLS-terminating Ingress controller, $scheme is always
    # "http" (nginx receives plain HTTP from the Ingress).  The Ingress sets
    # X-Forwarded-Proto: https to signal the original client scheme.
    # This map preserves that header when present; falls back to $scheme otherwise
    # (covers direct HTTP-only deployments and local dev without an Ingress).
    map $http_x_forwarded_proto $real_proto {
        default $scheme;
        https   https;
        http    http;
    }

    server {
        listen 80;
        server_name _;

        # ── Kubernetes probe endpoints ──────────────────────────────────────
        # Exact-match so they never fall through to the Next.js catch-all.
        # access_log off suppresses the per-second noise from kubelet probes.
        location = /healthz {
            proxy_pass         http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            access_log         off;
        }

        location = /readyz {
            proxy_pass         http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            access_log         off;
        }

        # ── Go backend routes ───────────────────────────────────────────────
        # Auth (OIDC login/callback/logout/me) and versioned API endpoints are
        # proxied directly to the Go binary — Next.js never sees these.
        location /auth/ {
            proxy_pass         http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $real_proto;
            proxy_read_timeout 30s;
            # The /auth/callback Set-Cookie header contains an AES-256-GCM
            # encrypted Pinniped session (id_token + access + refresh tokens)
            # which can reach 3–4 kB.  nginx's default 4 k proxy_buffer_size
            # rejects the response with "upstream sent too big header" (502).
            proxy_buffer_size  32k;
            proxy_buffers      4 32k;
        }

        # /api/v1/* → Go backend (longer prefix wins over /api/ below).
        location /api/v1/ {
            proxy_pass         http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $real_proto;
            proxy_read_timeout 30s;
        }

        # /api/* → Next.js BFF Route Handlers (/api/catalog/*, /api/scaffold/*, …)
        # These are server-side proxies in Next.js that read the HttpOnly session
        # cookie and forward requests to the Go backend on loopback.
        location /api/ {
            proxy_pass         http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $real_proto;
            proxy_read_timeout 30s;
        }

        # ── Next.js SSR server ──────────────────────────────────────────────
        # All requests including /_next/static/* and /public/* are proxied
        # through Node.js for now. This is intentionally simple — the portal
        # is early stage and keeping one location block reduces config surface
        # to debug.
        #
        # FUTURE — static asset serving from disk (when portal grows):
        # Add these two blocks ABOVE this location / block so they match first:
        #
        #   location /_next/static/ {
        #       alias /app/.next/static/;
        #       add_header Cache-Control "public, max-age=31536000, immutable";
        #       access_log off;
        #   }
        #
        #   location /public/ {
        #       alias /app/public/;
        #       add_header Cache-Control "public, max-age=86400";
        #       access_log off;
        #   }
        #
        # These serve immutable content-hashed files with sendfile() — zero
        # Node.js event loop usage for static assets. See README Design
        # Decisions → "nginx as the internal layer" for the full rationale.
        # The alias paths match where the Dockerfile copies the Next.js
        # standalone output: /app/.next/static/ and /app/public/.
        location / {
            proxy_pass         http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $real_proto;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 60s;
        }
    }
}
