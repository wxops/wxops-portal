apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: crossplane-controller
  title: Crossplane Controller
  description: Infrastructure control plane — reconciles Composite Resource Claims into real cloud resources (databases, caches, object storage, Gitea repos, Vault policies) via Composition Functions and provider-terraform.
  tags: [crossplane, kubernetes, infrastructure, terraform]
  annotations:
    gitea/source-location: platform/crossplane-compositions
    jira/project-key: WXOPS
spec:
  type: service
  lifecycle: production
  owner: group:platform-team
  system: platform
  consumesApis:
    - api:default/gitops-api
    - api:default/metrics-api
  dependsOn:
    - resource:default/gitops-infra-repo
    - resource:default/platform-vault
