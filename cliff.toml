[changelog]
header = """# Changelog

All notable changes to this project are documented in this file, starting with **v0.5.2**.
Versions follow [Semantic Versioning](https://semver.org/).
Commits follow [Conventional Commits](https://www.conventionalcommits.org/).

- **v0.5.2 and later** — each version below links to its [GitHub Release]($REPO/releases),
  which carries the release notes, the container image and the CLI binaries.
- **v0.1.0 – v0.5.1** — archived and frozen in [CHANGELOG-ARCHIVE.md](CHANGELOG-ARCHIVE.md).
  GitHub Releases begin at v0.5.2; those earlier versions were never published there.

> This file is regenerated from git history by running `make changelog`.
> Do not edit it manually.

---
"""

# The first condition renders NOTHING for v0.1.0–v0.5.1 (the archive boundary — see the
# note below the template). Everything else is the normal release layout.
body = """\
{% if version and version is matching("^v0[.]([0-4][.][0-9]+|5[.][01]([^0-9]|$))") %}\
{% else %}\
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}]($REPO/releases/tag/{{ version }}) — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} ⚠️ **BREAKING**{% endif %} ([`{{ commit.id | truncate(length=7, end="") }}`]($REPO/commit/{{ commit.id }}))
{% endfor %}\
{% endfor %}
{% endif %}\
"""

trim = false

# The repo URL is written once, as `$REPO`, in the header and body above and substituted
# here — this project's public home. (`[remote.*]` is deliberately not used: it makes
# git-cliff perform a live API call and abort generation if it fails — wrong host, no
# token, offline; verified directly — which this project has no need for.)
postprocessors = [
  { pattern = '\$REPO', replace = "https://github.com/wxops/wxops-portal" },
]

# ARCHIVE BOUNDARY. v0.1.0–v0.5.1 are frozen in CHANGELOG-ARCHIVE.md and GitHub Releases
# start at v0.5.2. The `is matching` test at the top of the body template is what keeps
# them out of the generated file — in ONE place, so it holds for every caller (`make
# changelog`, `make release`, and both CI release jobs) without a commit range on each
# command line. It is done in the template, not with `skip_tags`, on purpose: `skip_tags`
# drops those releases as far as git-cliff is concerned, and `git cliff --bumped-version`
# then returns nothing while the newest tag is a skipped one — which would break
# `make release`. (`ignore_tags` is no use either: it folds the old commits into the next
# release.) To move the boundary, change that one regex and the header text.

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_preprocessors = []

# Semver bump rules:
#   BREAKING CHANGE footer or ! in type  → major
#   feat                                  → minor
#   fix, perf                             → patch
commit_parsers = [
  { message = "^feat",                          group = "Features" },
  { message = "^fix",                           group = "Bug Fixes" },
  { message = "^perf",                          group = "Performance" },
  { message = "^refactor",                      group = "Refactoring" },
  { message = "^doc|^docs",                     group = "Documentation" },
  { message = "^style",                         group = "Styling" },
  { message = "^test",                          group = "Testing" },
  { message = "^chore\\(ci\\)",                 group = "CI/CD" },
  { message = "^chore\\(release\\): ",          skip = true },
  { message = "^chore",                         group = "Chores" },
  { body = ".*security",                        group = "Security" },
]

protect_breaking_commits = true
# Only include commits since the last tag.
filter_commits = false
# Match tags like v0.1.0, v1.2.3, v1.0.0-alpha.1
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+.*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "newest"
