apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: auth-service
  title: Auth Service
  description: OIDC authentication gateway — wraps Pinniped Supervisor, validates tokens, manages sessions in Redis, and proxies identity lookups to user-service.
  tags: [go, oidc, pinniped, identity]
  annotations:
    gitea/source-location: platform/auth-service
    jira/project-key: IDN
  links:
    - url: https://gitea.example.com/platform/auth-service/src/branch/main/docs/runbook.md
      title: Runbook
      icon: dashboard
spec:
  type: service
  lifecycle: experimental
  owner: group:identity-team
  system: identity
  providesApis:
    - api:default/auth-api
  consumesApis:
    - api:default/user-api
    - api:default/metrics-api
  dependsOn:
    - resource:default/session-cache
    - resource:default/identity-vault
