# ── API kind ─────────────────────────────────────────────────────────────────
# Represents an API contract. Linked from Component.providesApis.
# Backstage docs: https://backstage.io/docs/features/software-catalog/descriptor-format#kind-api

apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: payments-api
  description: Payment processing gRPC + REST API
  links:
    - url: https://gitea.example.com/platform/payments-service/src/branch/main/openapi.yaml
      title: OpenAPI Spec
      icon: api
spec:
  type: openapi                         # openapi | asyncapi | graphql | grpc
  lifecycle: production
  owner: group:platform-team
  system: payments
  # definition: |                       # inline spec — omit if linking via links above
  #   openapi: "3.0.0"
  #   ...

---
# ── System kind ───────────────────────────────────────────────────────────────
# Groups related components and APIs into a named system.
# Backstage docs: https://backstage.io/docs/features/software-catalog/descriptor-format#kind-system

apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: payments
  description: Everything related to payment processing — service, API, database, cache
spec:
  owner: group:platform-team
  domain: finance                       # optional — groups systems into domains

---
# ── Group kind ────────────────────────────────────────────────────────────────
# Represents a team. Should mirror your Gitea org/team structure.
# Backstage docs: https://backstage.io/docs/features/software-catalog/descriptor-format#kind-group

apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform-team
  description: Platform engineering team — owns the IDP, cluster infrastructure, and shared services
spec:
  type: team                            # team | business-unit | product
  parent: engineering                   # optional parent group
  children: []                          # sub-teams, if any
  members:
    - user:default/alice
    - user:default/bob

---
# ── Resource kind ─────────────────────────────────────────────────────────────
# Represents infrastructure a component depends on (DB, cache, storage bucket).
# Backstage docs: https://backstage.io/docs/features/software-catalog/descriptor-format#kind-resource

apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: payments-db
  description: PostgreSQL database for payment records (CloudNativePG)
  annotations:
    crossplane/claim-name: payments-service           # links to Crossplane Claim
    crossplane/claim-namespace: wxops-system
spec:
  type: database                        # database | cache | storage | queue | secret-store
  owner: group:platform-team
  system: payments
  dependsOn: []
