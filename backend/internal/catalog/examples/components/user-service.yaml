apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: user-service
  title: User Service
  description: Manages user profiles, group membership, and identity records. Source of truth for user data consumed by auth-service and the portal.
  tags: [go, grpc, identity]
  annotations:
    gitea/source-location: platform/user-service
    jira/project-key: IDN
  links:
    - url: https://gitea.example.com/platform/user-service/src/branch/main/docs/runbook.md
      title: Runbook
      icon: dashboard
spec:
  type: service
  lifecycle: production
  owner: group:identity-team
  system: identity
  providesApis:
    - api:default/user-api
  consumesApis:
    - api:default/metrics-api
  dependsOn:
    - resource:default/user-db
    - resource:default/session-cache
    - resource:default/identity-vault
