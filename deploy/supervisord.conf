[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
; Running as root is intentional — nginx needs port 80 (privileged port) and
; supervisord needs root to fork child processes under different UIDs.
; Child programs drop privileges via user= below. See README Design Decisions
; for the full trade-off and the future non-root migration path.
user=root

; ── Go backend ──────────────────────────────────────────────────────────────
; Runs as non-root 'node' user (UID 1000, present in node:20-alpine).
; supervisord itself stays root so it can manage processes with different
; users and so nginx can bind port 80 — but child processes drop privileges.
; Logs are prefixed [backend] by the Go process itself (log.SetPrefix).
; GIN_MODE=release suppresses debug route registration output.
[program:backend]
command=/usr/local/bin/wxops-backend
user=node
environment=GIN_MODE="release",PORT="8080"
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; ── Next.js SSR server ──────────────────────────────────────────────────────
; Runs as non-root 'node' user — /app is chowned to node in the Dockerfile.
; sed -e (not -u) for BusyBox compatibility — Alpine's sed has no -u flag.
; BACKEND_URL tells Next.js SSR page code where to reach the Go backend
; directly (bypassing nginx) for server-side fetch calls.
; HOSTNAME=127.0.0.1 binds Next.js to loopback — nginx is the public face.
[program:frontend]
command=/bin/sh -c "node /app/server.js 2>&1 | sed -e 's/^/[frontend] /'"
directory=/app
user=node
environment=NODE_ENV="production",PORT="3000",HOSTNAME="127.0.0.1",BACKEND_URL="http://127.0.0.1:8080"
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; ── nginx reverse proxy ──────────────────────────────────────────────────────
; Runs as root so it can bind port 80. nginx.conf has 'user nginx;' which
; drops worker processes to the nginx user — root is only the master process.
; nginx logs use the 'portal' log_format defined in nginx.conf which
; prefixes every access log line with [nginx].
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
