services:
  # ── Dex OIDC Identity Provider ──────────────────────────────────────────────
  # Dex is the upstream IdP that Pinniped Supervisor federates against.
  # It is NOT directly visible to the portal — the portal only talks to the
  # Pinniped Supervisor FederationDomain.
  dex:
    image: ghcr.io/dexidp/dex:v2.44.0
    container_name: wxops-dex
    ports:
      - "5556:5556"
    volumes:
      - ./dex-config.yaml:/etc/dex/config.yaml:ro
    command: ["dex", "serve", "/etc/dex/config.yaml"]

  # ── All-in-one portal image ──────────────────────────────────────────────────
  # Single container: nginx (port 80) → Go backend (8080) + Next.js SSR (3000).
  # Managed by supervisord. Logs are prefixed [nginx] / [backend] / [frontend].
  portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wxops-portal
    ports:
      - "80:80"
    environment:
      # ── Session & OIDC ──────────────────────────────────────────────────────
      # Generate SESSION_SECRET with: openssl rand -hex 32
      SESSION_SECRET: "${SESSION_SECRET:-change-me-generate-with-openssl-rand-hex-32}"

      # Pinniped Supervisor FederationDomain issuer URL.
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL:-https://supervisor.example.com/providers/pinniped}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-client.oauth.pinniped.dev-wxops-portal}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      OIDC_REDIRECT_URI: "http://localhost/auth/callback"

      # ── Go backend ─────────────────────────────────────────────────────────
      # FRONTEND_URL must match the browser-visible origin (nginx port 80).
      FRONTEND_URL: "http://localhost"
      FRONTEND_PORT: "8080"

      # Hub cluster — omit KUBECONFIG when running inside Kubernetes (in-cluster SA).
      KUBECONFIG: "${KUBECONFIG:-}"
      CLUSTER_NAMESPACE: "${CLUSTER_NAMESPACE:-wxops-system}"

      # Catalog source — set CATALOG_LOCAL_DIR for local dev testing.
      # In production, set GITEA_URL + GITEA_* instead.
      CATALOG_LOCAL_DIR: "${CATALOG_LOCAL_DIR:-}"
      GITEA_URL: "${GITEA_URL:-}"
      GITEA_TOKEN: "${GITEA_TOKEN:-}"
      GITEA_CATALOG_OWNER: "${GITEA_CATALOG_OWNER:-platform}"
      GITEA_CATALOG_REPO: "${GITEA_CATALOG_REPO:-gitops-infra}"
      GITEA_CATALOG_PATH: "${GITEA_CATALOG_PATH:-catalog}"

    depends_on:
      - dex
