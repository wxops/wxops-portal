basePath: /
definitions:
  catalog.Entity:
    properties:
      apiVersion:
        description: backstage.io/v1alpha1 (standard kinds) | wxops.cloud/v1alpha1
          (Doc)
        type: string
      kind:
        description: Component | API | System | Group | Resource | User | Doc
        type: string
      metadata:
        $ref: '#/definitions/catalog.EntityMetadata'
      spec:
        $ref: '#/definitions/catalog.EntitySpec'
    type: object
  catalog.EntityLink:
    properties:
      icon:
        description: Icon is a hint to the frontend (docs | dashboard | api | runbook
          | alert).
        type: string
      title:
        type: string
      type:
        type: string
      url:
        type: string
    type: object
  catalog.EntityMetadata:
    properties:
      annotations:
        additionalProperties:
          type: string
        description: |-
          Annotations carry tool-specific metadata.
          Example: "gitea/source-location": "platform/payments-service"
        type: object
      description:
        type: string
      labels:
        additionalProperties:
          type: string
        description: Labels are free-form key/value pairs for filtering.
        type: object
      links:
        items:
          $ref: '#/definitions/catalog.EntityLink'
        type: array
      name:
        description: |-
          Name is the unique identifier within the entity's kind and namespace.
          Used in API paths: /catalog/entities/Component/payments-service
        type: string
      namespace:
        description: defaults to "default"
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  catalog.EntitySpec:
    properties:
      author:
        description: |-
          Author is the user ref who authored this document.
          Format: "user:alice"
        type: string
      children:
        description: Children lists sub-group refs.
        items:
          type: string
        type: array
      consumesApis:
        description: ConsumesApis lists API entity refs consumed by this component.
        items:
          type: string
        type: array
      contentUrl:
        description: ContentURL is the Gitea raw URL for the markdown source file.
        type: string
      definition:
        description: |-
          ── API ──────────────────────────────────────────────────────────────
          Definition holds the raw API spec (OpenAPI YAML, AsyncAPI, etc.)
          Typically left empty here and fetched from the repo link instead.
        type: string
      dependsOn:
        description: |-
          DependsOn lists component or resource refs this entity depends on.
          Format: "component:default/user-service", "resource:default/payments-db"
        items:
          type: string
        type: array
      docStatus:
        description: 'DocStatus is the review lifecycle: proposed | under-review |
          accepted | deprecated | superseded'
        type: string
      docType:
        description: |-
          ── Doc ──────────────────────────────────────────────────────────────────
          DocType classifies the document: rfc | adr | runbook | documentation
        type: string
      domain:
        description: ── System ───────────────────────────────────────────────────────────
        type: string
      draft:
        description: |-
          Draft marks a Doc as not yet published. Draft docs are only visible
          to members of the owner team. Set to false (or omit) to publish.
        type: boolean
      email:
        description: Email is the user's contact address.
        type: string
      lifecycle:
        description: 'Lifecycle is the maturity stage: experimental | production |
          deprecated'
        type: string
      memberOf:
        description: |-
          ── User ─────────────────────────────────────────────────────────────────
          MemberOf lists group refs this user belongs to.
          Format: "group:rocket-team"
        items:
          type: string
        type: array
      members:
        description: Members lists user refs that belong to this group.
        items:
          type: string
        type: array
      owner:
        description: |-
          ── Common across most kinds ─────────────────────────────────────────
          Owner is a group or user reference: "group:platform-team", "user:alice"
        type: string
      parent:
        description: |-
          ── Group ────────────────────────────────────────────────────────────
          Parent is the parent group ref for nested org structures.
        type: string
      providesApis:
        description: ProvidesApis lists API entity refs exposed by this component.
        items:
          type: string
        type: array
      relatedTo:
        description: |-
          RelatedTo lists component/resource/API refs that this document describes.
          Format: "component:default/payments-service"
        items:
          type: string
        type: array
      supersededBy:
        description: |-
          SupersededBy is a Doc entity ref that replaces this document (e.g. RFC → ADR).
          Format: "doc:default/adr-001-kafka"
        type: string
      system:
        description: System groups related components under a named system.
        type: string
      type:
        description: |-
          ── Component ────────────────────────────────────────────────────────
          Type classifies the component: service | website | library | pipeline | documentation
        type: string
    type: object
  handlers.userResponsePayload:
    properties:
      groups:
        items:
          type: string
        type: array
      sub:
        type: string
      username:
        type: string
    type: object
  scaffold.AuthSpec:
    properties:
      enabled:
        type: boolean
    type: object
  scaffold.CreateProjectRequest:
    properties:
      apiEnabled:
        type: boolean
      apiType:
        description: openapi | asyncapi | grpc
        type: string
      appFlavor:
        description: 'Step 3: XTenantApp configuration'
        type: string
      appName:
        description: 'Step 1: Repository'
        type: string
      certManager:
        type: boolean
      containerPort:
        type: integer
      databaseSecrets:
        type: boolean
      dbExtensions:
        description: |-
          Database (XTenantDatabase) — only extensions are project-level.
          Name, tier, environment, and cluster details are configured per-env via the Promote flow.
        items:
          type: string
        type: array
      description:
        type: string
      devSpaceEnabled:
        type: boolean
      domain:
        type: string
      envVars:
        description: Plain env vars (non-secret, go into XTenantApp spec.parameters.env)
        items:
          $ref: '#/definitions/scaffold.KeyValue'
        type: array
      extraLabels:
        items:
          $ref: '#/definitions/scaffold.KeyValue'
        type: array
      ingressEnabled:
        description: Base config — env-agnostic settings that live in base/xtenant-app.yaml.
        type: boolean
      livenessPath:
        type: string
      metricsPath:
        description: e.g. /metrics
        type: string
      monitoringEnabled:
        type: boolean
      namespace:
        type: string
      openapiPath:
        description: relative path or public URL to spec
        type: string
      packageManager:
        type: string
      podAnnotations:
        description: Pod annotations and extra labels
        items:
          $ref: '#/definitions/scaffold.KeyValue'
        type: array
      readinessPath:
        type: string
      reloader:
        description: |-
          Platform feature toggles — these declare WHAT is enabled project-wide.
          HOW each feature is configured per environment is handled via the Promote flow.
        type: boolean
      rolloutType:
        type: string
      runtimeVersion:
        description: Runtime (from template.yaml runtime section)
        type: string
      ssoAuth:
        description: CertIssuer intentionally absent — ClusterIssuer is set per-env
          in the Promote flow.
        type: boolean
      systemName:
        description: Catalog — System is auto-created with name = appName
        type: string
      team:
        type: string
      templateId:
        description: 'Step 2: Template'
        type: string
      vaultSecrets:
        type: boolean
    required:
    - appName
    - team
    - templateId
    type: object
  scaffold.CreateProjectResponse:
    properties:
      appName:
        type: string
      repoUrl:
        type: string
      status:
        type: string
      team:
        type: string
    type: object
  scaffold.DevSpaceSpec:
    properties:
      command:
        items:
          type: string
        type: array
      enabled:
        type: boolean
      image:
        type: string
      replicas:
        type: integer
    type: object
  scaffold.EnvFromRef:
    properties:
      name:
        type: string
    type: object
  scaffold.EnvFromSource:
    properties:
      configMapRef:
        $ref: '#/definitions/scaffold.EnvFromRef'
      secretRef:
        $ref: '#/definitions/scaffold.EnvFromRef'
    type: object
  scaffold.EnvVar:
    properties:
      name:
        type: string
      value:
        type: string
    type: object
  scaffold.IngressSpec:
    properties:
      auth:
        $ref: '#/definitions/scaffold.AuthSpec'
      className:
        type: string
      enabled:
        type: boolean
      host:
        type: string
      path:
        type: string
      pathType:
        type: string
      tls:
        $ref: '#/definitions/scaffold.TLSSpec'
    type: object
  scaffold.KeyValue:
    properties:
      key:
        type: string
      value:
        type: string
    type: object
  scaffold.ProbeDetail:
    properties:
      enabled:
        type: boolean
      failureThreshold:
        type: integer
      path:
        type: string
      periodSeconds:
        type: integer
    type: object
  scaffold.ProbesSpec:
    properties:
      liveness:
        $ref: '#/definitions/scaffold.ProbeDetail'
      readiness:
        $ref: '#/definitions/scaffold.ProbeDetail'
      startup:
        $ref: '#/definitions/scaffold.ProbeDetail'
    type: object
  scaffold.ReloaderSpec:
    properties:
      enabled:
        type: boolean
    type: object
  scaffold.RepositorySpec:
    properties:
      url:
        type: string
    type: object
  scaffold.ResourceMeta:
    properties:
      labels:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
    type: object
  scaffold.ResourceSpec:
    properties:
      limits:
        $ref: '#/definitions/scaffold.ResourceValues'
      requests:
        $ref: '#/definitions/scaffold.ResourceValues'
    type: object
  scaffold.ResourceValues:
    properties:
      cpu:
        type: string
      memory:
        type: string
    type: object
  scaffold.RollingUpdate:
    properties:
      maxSurge:
        type: string
      maxUnavailable:
        type: string
    type: object
  scaffold.RolloutStrategy:
    properties:
      rollingUpdate:
        $ref: '#/definitions/scaffold.RollingUpdate'
      type:
        type: string
    type: object
  scaffold.SecretRefToggle:
    properties:
      enabled:
        type: boolean
      secretName:
        type: string
    type: object
  scaffold.SecretsFromSpec:
    properties:
      app:
        $ref: '#/definitions/scaffold.SecretRefToggle'
      database:
        $ref: '#/definitions/scaffold.SecretRefToggle'
    type: object
  scaffold.ServiceSpec:
    properties:
      enabled:
        type: boolean
      port:
        type: integer
      type:
        type: string
    type: object
  scaffold.TLSSpec:
    properties:
      clusterIssuer:
        type: string
      enabled:
        type: boolean
      secretName:
        type: string
    type: object
  scaffold.UpdateConfigRequest:
    properties:
      appFlavor:
        type: string
      certManager:
        type: boolean
      containerPort:
        type: integer
      databaseSecrets:
        type: boolean
      devSpaceEnabled:
        type: boolean
      envVars:
        items:
          $ref: '#/definitions/scaffold.KeyValue'
        type: array
      extraLabels:
        items:
          $ref: '#/definitions/scaffold.KeyValue'
        type: array
      ingressEnabled:
        type: boolean
      livenessPath:
        type: string
      namespace:
        type: string
      podAnnotations:
        items:
          $ref: '#/definitions/scaffold.KeyValue'
        type: array
      readinessPath:
        type: string
      reloader:
        type: boolean
      rolloutType:
        type: string
      ssoAuth:
        description: CertIssuer intentionally absent — ClusterIssuer is set per-env
          in the Promote flow.
        type: boolean
      templateId:
        type: string
      vaultSecrets:
        type: boolean
    type: object
  scaffold.XTenantApp:
    properties:
      apiVersion:
        type: string
      kind:
        type: string
      metadata:
        $ref: '#/definitions/scaffold.ResourceMeta'
      spec:
        $ref: '#/definitions/scaffold.XTenantAppSpec'
    type: object
  scaffold.XTenantAppParams:
    properties:
      appFlavor:
        type: string
      appName:
        type: string
      containerPort:
        type: integer
      devSpace:
        $ref: '#/definitions/scaffold.DevSpaceSpec'
      env:
        items:
          $ref: '#/definitions/scaffold.EnvVar'
        type: array
      envFrom:
        items:
          $ref: '#/definitions/scaffold.EnvFromSource'
        type: array
      image:
        type: string
      imagePullSecrets:
        items:
          type: string
        type: array
      ingress:
        $ref: '#/definitions/scaffold.IngressSpec'
      namespace:
        type: string
      podAnnotations:
        additionalProperties:
          type: string
        type: object
      probes:
        $ref: '#/definitions/scaffold.ProbesSpec'
      reloader:
        $ref: '#/definitions/scaffold.ReloaderSpec'
      replicas:
        type: integer
      repository:
        $ref: '#/definitions/scaffold.RepositorySpec'
      resources:
        $ref: '#/definitions/scaffold.ResourceSpec'
      rolloutStrategy:
        $ref: '#/definitions/scaffold.RolloutStrategy'
      secretsFrom:
        $ref: '#/definitions/scaffold.SecretsFromSpec'
      service:
        $ref: '#/definitions/scaffold.ServiceSpec'
      templateId:
        type: string
    type: object
  scaffold.XTenantAppSpec:
    properties:
      parameters:
        $ref: '#/definitions/scaffold.XTenantAppParams'
    type: object
host: localhost:8080
info:
  contact:
    name: Platform Team
    url: https://wxops.cloud
  description: Internal developer platform API — service catalog, Kubernetes cluster
    management, and OIDC authentication via Pinniped.
  title: WxOps Portal API
  version: "1.0"
paths:
  /api/v1/catalog/activity:
    get:
      description: Returns recent portal-created PRs (scaffold, register, edit) from
        gitops-infra.
      parameters:
      - description: 'PR state: open, closed, all (default: all)'
        in: query
        name: state
        type: string
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 20)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - CookieAuth: []
      summary: List catalog activity
      tags:
      - catalog
  /api/v1/catalog/entities:
    get:
      description: Returns all catalog entities. Use ?kind= to filter by entity kind
        (case-insensitive). Use ?search= for full-text search across name, title,
        description, and tags. Use ?owner= to filter by owning team (strips "group:"
        prefix).
      parameters:
      - description: Filter by kind (Component, API, System, Group, Resource, User,
          Doc)
        in: query
        name: kind
        type: string
      - description: Full-text search across name, title, description, and tags
        in: query
        name: search
        type: string
      - description: Filter by owner team (e.g. rocket-team or group:rocket-team)
        in: query
        name: owner
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: entities array
          schema:
            additionalProperties: true
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: List catalog entities
      tags:
      - catalog
    post:
      consumes:
      - application/json
      description: Creates a new catalog entity. Returns 409 Conflict if it already
        exists.
      parameters:
      - description: Entity to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/catalog.Entity'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Register a new catalog entity
      tags:
      - catalog
  /api/v1/catalog/entities/{kind}/{name}:
    delete:
      description: Deletes a catalog entity. Only platform-team admins can delete.
      parameters:
      - description: Entity kind
        in: path
        name: kind
        required: true
        type: string
      - description: Entity name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Delete catalog entity
      tags:
      - catalog
    get:
      description: Returns a single catalog entity by kind and name.
      parameters:
      - description: Entity kind (Component, API, System, Group, Resource, User, Doc)
        in: path
        name: kind
        required: true
        type: string
      - description: Entity name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/catalog.Entity'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Get catalog entity
      tags:
      - catalog
    put:
      consumes:
      - application/json
      description: Updates a catalog entity. Commits via PR in production or writes
        to disk in dev mode.
      parameters:
      - description: Entity kind
        in: path
        name: kind
        required: true
        type: string
      - description: Entity name
        in: path
        name: name
        required: true
        type: string
      - description: Updated entity
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/catalog.Entity'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Update catalog entity
      tags:
      - catalog
  /api/v1/catalog/entities/{kind}/{name}/ci:
    get:
      description: Returns recent Gitea Actions workflow runs for the entity's source
        repo.
      parameters:
      - description: Entity kind
        in: path
        name: kind
        required: true
        type: string
      - description: Entity name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - CookieAuth: []
      summary: Get CI status
      tags:
      - catalog
  /api/v1/catalog/entities/{kind}/{name}/content:
    get:
      description: Returns the raw Markdown content for a Doc entity. Fetches from
        spec.contentUrl via the Gitea client or the local reader.
      parameters:
      - description: Must be Doc
        in: path
        name: kind
        required: true
        type: string
      - description: Document name
        in: path
        name: name
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: Markdown content
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Get document content
      tags:
      - catalog
  /api/v1/catalog/entities/{kind}/{name}/deprecate:
    post:
      consumes:
      - application/json
      parameters:
      - description: Entity kind
        in: path
        name: kind
        required: true
        type: string
      - description: Entity name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      security:
      - CookieAuth: []
      summary: Deprecate an entity
      tags:
      - catalog
  /api/v1/catalog/entities/{kind}/{name}/packages:
    get:
      description: Reads go.mod, package.json, requirements.txt, pyproject.toml from
        the source repo.
      parameters:
      - description: Entity kind
        in: path
        name: kind
        required: true
        type: string
      - description: Entity name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - CookieAuth: []
      summary: Get package dependencies
      tags:
      - catalog
  /api/v1/catalog/entities/{kind}/{name}/promostatus:
    get:
      parameters:
      - description: Entity kind
        in: path
        name: kind
        required: true
        type: string
      - description: Entity name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - CookieAuth: []
      summary: Get promotion status
      tags:
      - catalog
  /api/v1/catalog/entities/{kind}/{name}/promote:
    post:
      consumes:
      - application/json
      parameters:
      - description: Entity kind
        in: path
        name: kind
        required: true
        type: string
      - description: Entity name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      security:
      - CookieAuth: []
      summary: Promote entity lifecycle
      tags:
      - catalog
  /api/v1/catalog/entities/{kind}/{name}/releases:
    get:
      description: Returns Gitea Releases and container images from the Package Registry.
      parameters:
      - description: Entity kind
        in: path
        name: kind
        required: true
        type: string
      - description: Entity name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - CookieAuth: []
      summary: Get releases and container images
      tags:
      - catalog
  /api/v1/catalog/entities/{kind}/{name}/spec:
    get:
      description: Returns the raw OpenAPI/AsyncAPI spec for an API entity. Resolves
        from inline definition or an openapi-typed link URL.
      parameters:
      - description: Entity kind (usually API)
        in: path
        name: kind
        required: true
        type: string
      - description: Entity name
        in: path
        name: name
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: Raw OpenAPI YAML or JSON
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Get API spec
      tags:
      - catalog
  /api/v1/catalog/entities/{kind}/{name}/versions:
    get:
      description: Returns the latest tag for each environment (dev/staging/production)
        from the entity's source repo.
      parameters:
      - description: Entity kind
        in: path
        name: kind
        required: true
        type: string
      - description: Entity name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - CookieAuth: []
      summary: Get per-environment versions
      tags:
      - catalog
  /api/v1/scaffold/projects:
    post:
      parameters:
      - description: Project scaffold request
        in: body
        name: body
        required: true
        schema:
