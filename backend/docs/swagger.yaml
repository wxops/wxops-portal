basePath: /
definitions:
  catalog.Entity:
    properties:
      apiVersion:
        description: backstage.io/v1alpha1 (standard kinds) | wxops.cloud/v1alpha1
          (Doc)
        type: string
      kind:
        description: Component | API | System | Group | Resource | User | Doc
        type: string
      metadata:
        $ref: '#/definitions/catalog.EntityMetadata'
      spec:
        $ref: '#/definitions/catalog.EntitySpec'
    type: object
  catalog.EntityLink:
    properties:
      icon:
        description: Icon is a hint to the frontend (docs | dashboard | api | runbook
          | alert).
        type: string
      title:
        type: string
      type:
        type: string
      url:
        type: string
    type: object
  catalog.EntityMetadata:
    properties:
      annotations:
        additionalProperties:
          type: string
        description: |-
          Annotations carry tool-specific metadata.
          Example: "gitea/source-location": "platform/payments-service"
        type: object
      description:
        type: string
      labels:
        additionalProperties:
          type: string
        description: Labels are free-form key/value pairs for filtering.
        type: object
      links:
        items:
          $ref: '#/definitions/catalog.EntityLink'
        type: array
      name:
        description: |-
          Name is the unique identifier within the entity's kind and namespace.
          Used in API paths: /catalog/entities/Component/payments-service
        type: string
      namespace:
        description: defaults to "default"
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  catalog.EntitySpec:
    properties:
      author:
        description: |-
          Author is the user ref who authored this document.
          Format: "user:alice"
        type: string
      children:
        description: Children lists sub-group refs.
        items:
          type: string
        type: array
      consumesApis:
        description: ConsumesApis lists API entity refs consumed by this component.
        items:
          type: string
        type: array
      contentUrl:
        description: ContentURL is the Gitea raw URL for the markdown source file.
        type: string
      definition:
        description: |-
          ── API ──────────────────────────────────────────────────────────────
          Definition holds the raw API spec (OpenAPI YAML, AsyncAPI, etc.)
          Typically left empty here and fetched from the repo link instead.
        type: string
      dependsOn:
        description: |-
          DependsOn lists component or resource refs this entity depends on.
          Format: "component:default/user-service", "resource:default/payments-db"
        items:
          type: string
        type: array
      docStatus:
        description: 'DocStatus is the review lifecycle: proposed | under-review |
          accepted | deprecated | superseded'
        type: string
      docType:
        description: |-
          ── Doc ──────────────────────────────────────────────────────────────────
          DocType classifies the document: rfc | adr | documentation
        type: string
      domain:
        description: ── System ───────────────────────────────────────────────────────────
        type: string
      email:
        description: Email is the user's contact address.
        type: string
      lifecycle:
        description: 'Lifecycle is the maturity stage: experimental | production |
          deprecated'
        type: string
      memberOf:
        description: |-
          ── User ─────────────────────────────────────────────────────────────────
          MemberOf lists group refs this user belongs to.
          Format: "group:rocket-team"
        items:
          type: string
        type: array
      members:
        description: Members lists user refs that belong to this group.
        items:
          type: string
        type: array
      owner:
        description: |-
          ── Common across most kinds ─────────────────────────────────────────
          Owner is a group or user reference: "group:platform-team", "user:alice"
        type: string
      parent:
        description: |-
          ── Group ────────────────────────────────────────────────────────────
          Parent is the parent group ref for nested org structures.
        type: string
      providesApis:
        description: ProvidesApis lists API entity refs exposed by this component.
        items:
          type: string
        type: array
      relatedTo:
        description: |-
          RelatedTo lists component/resource/API refs that this document describes.
          Format: "component:default/payments-service"
        items:
          type: string
        type: array
      supersededBy:
        description: |-
          SupersededBy is a Doc entity ref that replaces this document (e.g. RFC → ADR).
          Format: "doc:default/adr-001-kafka"
        type: string
      system:
        description: System groups related components under a named system.
        type: string
      type:
        description: |-
          ── Component ────────────────────────────────────────────────────────
          Type classifies the component: service | website | library | pipeline | documentation
        type: string
    type: object
  handlers.userResponsePayload:
    properties:
      groups:
        items:
          type: string
        type: array
      sub:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: Platform Team
    url: https://wxops.cloud
  description: Internal developer platform API — service catalog, Kubernetes cluster
    management, and OIDC authentication via Pinniped.
  title: WxOps Portal API
  version: "1.0"
paths:
  /api/v1/catalog/entities:
    get:
      description: Returns all catalog entities. Use ?kind= to filter by entity kind
        (case-insensitive).
      parameters:
      - description: Filter by kind (Component, API, System, Group, Resource, User,
          Doc)
        in: query
        name: kind
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: entities array
          schema:
            additionalProperties: true
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: List catalog entities
      tags:
      - catalog
  /api/v1/catalog/entities/{kind}/{name}:
    get:
      description: Returns a single catalog entity by kind and name.
      parameters:
      - description: Entity kind (Component, API, System, Group, Resource, User, Doc)
        in: path
        name: kind
        required: true
        type: string
      - description: Entity name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/catalog.Entity'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Get catalog entity
      tags:
      - catalog
  /api/v1/catalog/entities/{kind}/{name}/content:
    get:
      description: Returns the raw Markdown content for a Doc entity. Fetches from
        spec.contentUrl via the Gitea client or the local reader.
      parameters:
      - description: Must be Doc
        in: path
        name: kind
        required: true
        type: string
      - description: Document name
        in: path
        name: name
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: Markdown content
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Get document content
      tags:
      - catalog
  /api/v1/catalog/entities/{kind}/{name}/spec:
    get:
      description: Returns the raw OpenAPI/AsyncAPI spec for an API entity. Resolves
        from inline definition or an openapi-typed link URL.
      parameters:
      - description: Entity kind (usually API)
        in: path
        name: kind
        required: true
        type: string
      - description: Entity name
        in: path
        name: name
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: Raw OpenAPI YAML or JSON
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Get API spec
      tags:
      - catalog
  /auth/callback:
    get:
      description: Exchanges the authorization code for tokens, validates the id_token,
        and writes an encrypted session cookie.
      parameters:
      - description: Authorization code
        in: query
        name: code
        required: true
        type: string
      - description: CSRF state token
        in: query
        name: state
        required: true
        type: string
      responses:
        "302":
          description: Redirect to dashboard
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: OIDC callback
      tags:
      - auth
  /auth/login:
    get:
      description: Redirects the browser to the Pinniped Supervisor authorization
        endpoint to begin the PKCE flow.
      responses:
        "302":
          description: Redirect to OIDC provider
          schema:
            type: string
      summary: Start OIDC login
      tags:
      - auth
  /auth/logout:
    post:
      description: Clears the session cookie, effectively logging the user out.
      produces:
      - application/json
      responses:
        "200":
          description: 'message: logged out'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Sign out
      tags:
      - auth
  /auth/me:
    get:
      description: Returns sub, username, and group memberships from the session.
        Available on both /auth/me (unauthenticated, for Next.js SSR) and /api/v1/me
        (protected).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.userResponsePayload'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Current user identity
      tags:
      - auth
  /healthz:
    get:
      description: Returns 200 as long as the process is alive. Used by the Kubernetes
        liveness and startup probes.
      produces:
      - application/json
      responses:
        "200":
          description: 'status: ok'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness probe
      tags:
      - health
  /readyz:
    get:
      description: Returns 200 when the server is ready to accept traffic. Kept separate
        from /healthz so probes can be tuned independently.
      produces:
      - application/json
      responses:
        "200":
          description: 'status: ok'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Readiness probe
      tags:
      - health
schemes:
- http
- https
securityDefinitions:
  CookieAuth:
    description: Encrypted session cookie issued after OIDC login.
    in: cookie
    name: wxops_session
    type: apiKey
swagger: "2.0"
