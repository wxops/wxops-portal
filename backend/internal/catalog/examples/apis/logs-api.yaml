apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: logs-api
  title: Logs API
  description: Loki LogQL HTTP API for structured log queries. Exposes label discovery, log stream queries, and metric queries over ingested logs from all platform services.
  tags: [loki, logs, observability, logql]
  annotations:
    jira/project-key: OBS
spec:
  type: openapi
  lifecycle: production
  owner: group:observability-team
  system: observability
  definition: |
    openapi: "3.0.3"
    info:
      title: Logs API
      version: "1.0.0"
    paths:
      /loki/api/v1/query:
        get:
          summary: Instant LogQL query
          parameters:
            - name: query
              in: query
              required: true
              schema: { type: string }
          responses:
            "200":
              description: Log query result
      /loki/api/v1/query_range:
        get:
          summary: Range LogQL query
          parameters:
            - name: query
              in: query
              required: true
              schema: { type: string }
            - name: start
              in: query
              required: true
              schema: { type: string }
            - name: end
              in: query
              required: true
              schema: { type: string }
          responses:
            "200":
              description: Log range result
      /loki/api/v1/labels:
        get:
          summary: List available labels
          responses:
            "200":
              description: Label names
