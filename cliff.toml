[changelog]
header = """# Changelog

All notable changes to this project will be documented in this file.
Versions follow [Semantic Versioning](https://semver.org/).
Commits follow [Conventional Commits](https://www.conventionalcommits.org/).

> This file is regenerated from git history by running `make changelog`.
> Do not edit it manually.

---
"""

body = """{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} ⚠️ **BREAKING**{% endif %} ([`{{ commit.id | truncate(length=7, end="") }}`](https://gitea.xeusnguyen.xyz/platform-team/wxops-portal-v2/commit/{{ commit.id }}))
{% endfor %}\
{% endfor %}
"""

footer = """---

{% for release in releases %}\
{% if release.version %}\
[{{ release.version | trim_start_matches(pat="v") }}] - \
https://gitea.xeusnguyen.xyz/platform-team/wxops-portal-v2/releases/tag/{{ release.version }}
{% endif %}\
{% endfor %}\
{% set latest = releases | filter(attribute="version") | first %}\
{% if latest %}\
[Unreleased] - https://gitea.xeusnguyen.xyz/platform-team/wxops-portal-v2/compare/{{ latest.version }}...HEAD
{% endif %}\
"""

trim = false

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_preprocessors = []

# Semver bump rules:
#   BREAKING CHANGE footer or ! in type  → major
#   feat                                  → minor
#   fix, perf                             → patch
commit_parsers = [
  { message = "^feat",                          group = "Features" },
  { message = "^fix",                           group = "Bug Fixes" },
  { message = "^perf",                          group = "Performance" },
  { message = "^refactor",                      group = "Refactoring" },
  { message = "^doc|^docs",                     group = "Documentation" },
  { message = "^style",                         group = "Styling" },
  { message = "^test",                          group = "Testing" },
  { message = "^chore\\(ci\\)",                 group = "CI/CD" },
  { message = "^chore\\(release\\): ",          skip = true },
  { message = "^chore",                         group = "Chores" },
  { body = ".*security",                        group = "Security" },
]

protect_breaking_commits = true
# Only include commits since the last tag.
filter_commits = false
# Match tags like v0.1.0, v1.2.3, v1.0.0-alpha.1
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+.*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "newest"
