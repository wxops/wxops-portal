  /auth/callback:
    get:
      description: Exchanges the authorization code for tokens, validates the id_token,
        and writes an encrypted session cookie.
      parameters:
      - description: Authorization code
        in: query
        name: code
        required: true
        type: string
      - description: CSRF state token
        in: query
        name: state
        required: true
        type: string
      responses:
        "302":
          description: Redirect to dashboard
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: OIDC callback
      tags:
      - auth
  /auth/login:
    get:
      description: Redirects the browser to the Pinniped Supervisor authorization
        endpoint to begin the PKCE flow.
      responses:
        "302":
          description: Redirect to OIDC provider
          schema:
            type: string
      summary: Start OIDC login
      tags:
      - auth
  /auth/logout:
    post:
      description: Clears the session cookie, effectively logging the user out.
      produces:
      - application/json
      responses:
        "200":
          description: 'message: logged out'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Sign out
      tags:
      - auth
  /auth/me:
    get:
      description: Returns sub, username, and group memberships from the session.
        Available on both /auth/me (unauthenticated, for Next.js SSR) and /api/v1/me
        (protected).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.userResponsePayload'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Current user identity
      tags:
      - auth
  /healthz:
    get:
      description: Returns 200 as long as the process is alive. Used by the Kubernetes
        liveness and startup probes.
      produces:
      - application/json
      responses:
        "200":
          description: 'status: ok'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness probe
      tags:
      - health
  /readyz:
    get:
      description: Returns 200 when the server is ready to accept traffic. Kept separate
        from /healthz so probes can be tuned independently.
      produces:
      - application/json
      responses:
        "200":
          description: 'status: ok'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Readiness probe
      tags:
      - health
schemes:
- http
- https
securityDefinitions:
  CookieAuth:
    description: Encrypted session cookie issued after OIDC login.
    in: cookie
    name: wxops_session
    type: apiKey
swagger: "2.0"
