apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: wxops-portal
  title: W'xOps Portal
  description: Internal Developer Portal — multi-cluster Kubernetes UI, service catalog, and project scaffolding. Authenticates via Pinniped Supervisor, commits to gitops-infra via Gitea API.
  tags: [go, nextjs, portal, idp]
  annotations:
    gitea/source-location: platform/wxops-portal-v2
    jira/project-key: WXOPS
  links:
    - url: https://gitea.example.com/platform/wxops-portal-v2/src/branch/main/README.md
      title: README
      icon: docs
spec:
  type: website
  lifecycle: experimental
  owner: group:platform-team
  system: platform
  providesApis:
    - api:default/portal-api
  consumesApis:
    - api:default/gitops-api
    - api:default/auth-api
    - api:default/metrics-api
  dependsOn:
    - resource:default/platform-vault
    - resource:default/gitops-infra-repo
