name: CI / Release

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]

# ── Variable resolution ────────────────────────────────────────────────────────
#
# Org-level   → Gitea: Organization > Settings > Actions > Variables
#   GO_VERSION    default: 1.23          bump once; all Go repos in the org inherit
#   NODE_VERSION  default: 20            Node LTS managed centrally
#   REGISTRY      default: ghcr.io       switch the registry once for every repo
#   RUNNER_LABEL  default: ubuntu-latest use a self-hosted runner label here if needed
#
# Repo-level  → Gitea: Repository > Settings > Actions > Variables
#   GO_CACHE_PATH   default: backend/go.sum             monorepo: Go module is in subdir
#   NPM_CACHE_PATH  default: frontend/package-lock.json  monorepo: frontend is in subdir
#
# Auto-injected by Gitea — no setup required
#   secrets.GITEA_TOKEN  provided per run same as GITHUB_TOKEN for authentication
#   github.repository     org/repo  (e.g. wxops/wxops-portal-v2)
#   github.ref_name       tag or branch name
#   github.actor          user who triggered the run
#
# NOT pipeline variables — runtime app config injected via K8s Secrets at deploy time
#   OIDC_CLIENT_SECRET, SESSION_SECRET, GITEA_TOKEN, OIDC_ISSUER_URL, …
#
env:
  GO_VERSION:     ${{ vars.GO_VERSION     || '1.23' }}
  NODE_VERSION:   ${{ vars.NODE_VERSION   || '20'   }}
  REGISTRY:       ${{ vars.REGISTRY       || 'ghcr.io/wxops' }}
  GO_CACHE_PATH:  ${{ vars.GO_CACHE_PATH  || 'backend/go.sum' }}
  NPM_CACHE_PATH: ${{ vars.NPM_CACHE_PATH || 'frontend/package-lock.json' }}

permissions:
  contents: write   # changelog commit + release creation

jobs:
  # ── Go backend ──────────────────────────────────────────────────────────────
  backend:
    name: Backend (Go)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.GO_CACHE_PATH }}

      - name: Build
        run: cd backend && go build ./...

      - name: Vet
        run: cd backend && go vet ./...

  # ── Next.js frontend ────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node.js)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.NPM_CACHE_PATH }}

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint
        run: cd frontend && npm run lint

      - name: Type check
        run: cd frontend && npx tsc --noEmit

  # ── Docker build + release (tag pushes only) ─────────────────────────────────
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    needs: [backend, frontend]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git-cliff needs full history to build the changelog
          token: ${{ secrets.REPO_ACCESS_TOKEN }}  # for pushing changelog commit back to main

      # ── Build and push Docker image to Gitea registry ─────────────────────────
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3848c948dfd788546e5e9768f56d05abdf4c5ce90
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/wxops-portal-v2:${{ github.ref_name }}
            ${{ env.REGISTRY }}/wxops-portal-v2:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/wxops-portal-v2:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/wxops-portal-v2:cache,mode=max

      # --- Update changelog ---------------------------------
      - name: Install git-cliff
        run: pip install git-cliff --break-system-packages

      - name: Regenerate CHANGELOG.md
        run: git-cliff -o CHANGELOG.md

      - name: Commit and push updated files
        run: |
          git config user.name  "W'xOps Platform Bot"
          git config user.email "wxopsbot@wxops.cloud"
          git add CHANGELOG.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): update changelog for ${{ github.ref_name }}"
            git push origin HEAD:main
          fi

      # ── Publish release ──────────────────────────────────────────────────────

      - name: Build release body
        env:
          VERSION: ${{ github.ref_name }}
          IMAGE: ${{ env.REGISTRY }}/wxops-portal-v2
        run: |
          # Priority: version-specific file → template → raw cliff output.
          # Both version-specific files and template support the same placeholders:
          #   {{CLIFF_NOTES}}  auto-generated commit list for this tag
          #   {{VERSION}}      tag name (e.g. v1.2.0)
          #   {{IMAGE}}        full registry image path
          # Including {{CLIFF_NOTES}} in a version-specific file merges hand-written
          # notes with the auto-generated commit list.
          notes_file="release-notes/${VERSION}.md"
          if [ -f "$notes_file" ]; then
            source_file="$notes_file"
          elif [ -f "release-notes/template.md" ]; then
            source_file="release-notes/template.md"
          else
            source_file=""
          fi

          if [ -n "$source_file" ]; then
            git-cliff --current --strip all > /tmp/cliff-notes.md
            sed \
              -e "s|{{IMAGE}}|${IMAGE}|g" \
              -e "s|{{VERSION}}|${VERSION}|g" \
              -e '/{{CLIFF_NOTES}}/{' \
              -e 'r /tmp/cliff-notes.md' \
              -e 'd' \
              -e '}' \
              "$source_file" > /tmp/release-body.md
          else
            git-cliff --current --strip all > /tmp/release-body.md
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: /tmp/release-body.md
          draft: false
          prerelease: false
          token: ${{ secrets.GITEA_TOKEN }}
