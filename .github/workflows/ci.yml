name: CI / Release

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]

# ── Ported from .gitea/workflows/ci.yml ─────────────────────────────────────────
#
# Gitea Actions deliberately mirrors GitHub Actions syntax and contexts, so this
# file is close to a 1:1 port. What actually changed, and why:
#
#   - secrets.GITEA_TOKEN → secrets.GITHUB_TOKEN. GitHub auto-issues one per run,
#     scoped to this repo, and it carries the permissions granted by the top-level
#     `permissions:` block below (capped by the organization's Actions policy).
#   - Registry auth switched from a REGISTRY_USERNAME/PASSWORD PAT to the native
#     GITHUB_TOKEN (username: github.actor). Standard for GHCR from a public repo
#     — no PAT to create, store, or rotate. See the `release` job for the tradeoff
#     if you ever need to push to a non-GHCR registry instead.
#   - Image path is computed as REGISTRY/IMAGE_NAME instead of a single hardcoded
#     `ghcr.io/wxops` var, so it does not silently point at the wrong owner if this
#     repo ends up under a different GitHub org or a personal account. Override
#     either var below if you need something else. REGISTRY must stay the bare
#     host (`ghcr.io`) — never `ghcr.io/<owner>`: the owner already comes from
#     IMAGE_NAME (`<owner>/<repo>`), and an owner-qualified REGISTRY (this project's
#     Gitea convention is `ghcr.io/wxops`) would double it.
#   - REPO_ACCESS_TOKEN is REMOVED. It was a hand-managed PAT whose only job was
#     pushing the changelog commit to main, and a missing or expired one failed the
#     whole release job at checkout. Everything now runs on GITHUB_TOKEN with the
#     repo permissions granted by the top-level `permissions:` block (`contents:
#     write`, `packages: write`) — nothing to create, store, or rotate.
#   - Packages are REPO-level, not org-level. The image is ghcr.io/<owner>/<repo> and
#     the Helm chart is ghcr.io/<owner>/<repo>/charts/<chart> (it used to be the
#     org-level ghcr.io/<owner>/charts). The `org.opencontainers.image.source` label
#     on the image, and the `sources:` entry in Chart.yaml for the chart, link each
#     package to this repository; a linked package inherits the repo's access, which
#     is what lets GITHUB_TOKEN push to it with `packages: write`.
#
# ── Variable resolution ────────────────────────────────────────────────────────
#
# Repository variables → GitHub: repo Settings > Secrets and variables > Actions
#                                  > Variables tab
#   GO_CACHE_PATH   default: backend/go.sum              monorepo: Go module is in subdir
#   NPM_CACHE_PATH  default: frontend/package-lock.json   monorepo: frontend is in subdir
#   REGISTRY        default: ghcr.io                      switch registries here (bare host only)
#   IMAGE_NAME      default: ${{ github.repository }}     override if publishing under a different name
#
# Organization variables (only if this repo lives under a GitHub org) →
#                                  Org Settings > Secrets and variables > Actions
#   GO_VERSION      default: 1.23   bump once; every Go repo in the org inherits
#   NODE_VERSION    default: 22     Node LTS managed centrally
#   RUNNER_LABEL    default: ubuntu-latest   set a self-hosted runner label here if needed
#
# Auto-injected by GitHub — no setup required
#   secrets.GITHUB_TOKEN   scoped to this repo for the run's lifetime
#   github.repository      owner/repo  (e.g. wxops/wxops-portal)
#   github.ref_name        tag or branch name
#   github.actor           user or bot who triggered the run
#
# Secrets to configure: none.
#
# One-time GitHub settings the workflow depends on (it cannot set these itself):
#   - Org Settings > Actions > General > Workflow permissions must let this repo's
#     GITHUB_TOKEN have write access (the `permissions:` block below asks for
#     `contents: write` and `packages: write`).
#   - A package that ALREADY exists under the org (published earlier by hand, with a
#     PAT, or at the old org-level path) is not linked to this repo, so GITHUB_TOKEN
#     is refused with `permission_denied: write_package`. Fix once per package:
#     Package settings > "Manage Actions access" > add this repository with the
#     Write role (or connect the repository). New packages published by this
#     workflow link themselves.
#
# NOT pipeline variables — runtime app config injected via K8s Secrets at deploy time
#   OIDC_CLIENT_SECRET, SESSION_SECRET, GITEA_TOKEN, OIDC_ISSUER_URL, …
#   ARGOCD_URL, LGTM_GRAFANA_URL, LGTM_*_DATASOURCE
#
#   ARGOCD_URL used to be an org-level Actions variable injected at build time as
#   NEXT_PUBLIC_ARGOCD_URL. It became runtime backend config in v0.5.0 and must
#   NOT be re-added as a build-arg: a NEXT_PUBLIC_* value is sealed into the JS
#   bundle, so repointing ArgoCD would need a full image rebuild instead of a
#   Deployment env edit. Same reasoning for every LGTM_* value.
#
env:
  GO_VERSION:     ${{ vars.GO_VERSION     || '1.23' }}
  NODE_VERSION:   ${{ vars.NODE_VERSION   || '22'   }}
  REGISTRY:       ${{ vars.REGISTRY       || 'ghcr.io' }}
  IMAGE_NAME:     ${{ vars.IMAGE_NAME     || github.repository }}
  GO_CACHE_PATH:  ${{ vars.GO_CACHE_PATH  || 'backend/go.sum' }}
  NPM_CACHE_PATH: ${{ vars.NPM_CACHE_PATH || 'frontend/package-lock.json' }}

permissions:
  contents: write   # changelog commit + release creation
  packages: write   # push the image to ghcr.io via GITHUB_TOKEN

jobs:
  # ── Go backend ──────────────────────────────────────────────────────────────
  backend:
    name: Backend (Go)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.GO_CACHE_PATH }}

      - name: Build
        run: cd backend && go build ./...

      - name: Vet
        run: cd backend && go vet ./...

  # ── Next.js frontend ────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node.js)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.NPM_CACHE_PATH }}

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint
        run: cd frontend && npm run lint

      - name: Type check
        run: cd frontend && npx tsc --noEmit

  # ── wxops CLI cross-platform build ──────────────────────────────────────────
  cli:
    name: CLI (wxops)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: cli/go.sum

      - name: Build
        run: cd cli && go build ./...

      - name: Vet
        run: cd cli && go vet ./...

      - name: Cross-compile (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist
          for GOOS in linux darwin; do
            for GOARCH in amd64 arm64; do
              GOOS=$GOOS GOARCH=$GOARCH go build \
                -ldflags="-X main.version=${{ github.ref_name }}" \
                -o dist/wxops-${GOOS}-${GOARCH} \
                ./cmd/wxops
            done
          done
        working-directory: cli

  # ── Docker build + release (tag pushes only) ─────────────────────────────────
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    needs: [backend, frontend, cli]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      # No `token:` here on purpose — checkout defaults to this run's GITHUB_TOKEN,
      # which carries the `contents: write` granted at the top of this file. That is
      # what the changelog push below uses, so there is no PAT/secret to manage.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git-cliff needs full history to build the changelog

      # ── Derive APP_VERSION from the git tag ──────────────────────────────────
      # Strips the leading 'v' (v0.3.0 → 0.3.0) and saves to $GITHUB_ENV so
      # it can be passed to docker build as APP_VERSION (baked into the bundle
      # via NEXT_PUBLIC_APP_VERSION). package.json is intentionally NOT updated
      # to avoid invalidating the Next.js build cache on local dev restarts.
      - name: Set version
        run: |
          SEMVER="${{ github.ref_name }}"
          SEMVER="${SEMVER#v}"
          echo "APP_VERSION=$SEMVER" >> "$GITHUB_ENV"

      # ── Build and push Docker image to GHCR ───────────────────────────────────
      - uses: docker/setup-buildx-action@v4

      # Native GITHUB_TOKEN auth — no PAT to create or rotate. This works because
      # `permissions.packages: write` above lets the token push, and the package is
      # linked to THIS repository (the `org.opencontainers.image.source` label in the
      # build step below), so it is governed by the repo's access rather than being
      # a loose org-level package. If you ever need to push to a different registry
      # (Docker Hub, a private registry), swap this for the REGISTRY_USERNAME /
      # REGISTRY_PASSWORD secret pair the way the Gitea workflow did.
      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
          # `source` is the one that matters: GHCR reads it to link this package to the
          # repository, which makes it a repo-level package that inherits the repo's
          # access. Without it the image is an unlinked org-level package and a
          # GITHUB_TOKEN push can be refused with `permission_denied: write_package`.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.APP_VERSION }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache,mode=max

      # ── Package and publish the Helm chart ────────────────────────────────────
      # charts/Chart.yaml and charts/values.yaml keep a stable placeholder
      # version in the repo — same reasoning as APP_VERSION / package.json
      # above: bumping the checked-in file on every release just to invalidate
      # it again next time isn't worth a commit. Patched here, in the working
      # tree only, right before packaging; never committed back. The published
      # .tgz carries the real version — that's the artifact that matters.
      #
      # `portal.image.tag` is set explicitly rather than left to inherit
      # .Chart.AppVersion: verified directly that doesn't work here, since
      # that expression lives inside the `common` dependency's own templates,
      # where .Chart resolves to common's Chart.yaml (no appVersion), never
      # this chart's.
      - uses: azure/setup-helm@v4

      - name: Bump chart version and appVersion to match the release tag
        run: |
          sed -i \
            -e "s/^version: .*/version: ${{ env.APP_VERSION }}/" \
            -e "s/^appVersion: .*/appVersion: \"${{ env.APP_VERSION }}\"/" \
            charts/Chart.yaml
          sed -i \
            "s/^\(\s*tag:\s*\).*/\1\"${{ env.APP_VERSION }}\"/" \
            charts/values.yaml

      - name: Log in to ${{ env.REGISTRY }} (Helm OCI)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin

      - name: Package chart
        run: |
          helm dependency build charts/
          helm package charts/ --destination /tmp/helm-dist

      # Pushed UNDER the repo's own path (ghcr.io/<owner>/<repo>/charts/<chart>), next
      # to the image, not into an org-level `<owner>/charts` namespace. Helm records
      # Chart.yaml's first `sources:` entry (this repo) as the OCI source annotation,
      # which is what links the chart package to the repository the same way the
      # `source` label does for the image.
      - name: Push chart
        run: helm push /tmp/helm-dist/wxops-portal-${{ env.APP_VERSION }}.tgz oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/charts

      # --- Update changelog ---------------------------------
      # cliff.toml's committed default points at the internal Gitea repo — that's
      # what `make changelog` and the Gitea CI release job are supposed to
      # produce, and it must stay that way. Patch it here, in this job only, so
      # the CHANGELOG.md and release notes this workflow generates link at the
      # public GitHub repo instead. github.repository (not a hardcoded value)
      # so this stays correct even if the repo is renamed or transferred.
      #
      # This only touches the working tree — the "Commit and push" step below
      # stages CHANGELOG.md alone, so the patched cliff.toml is never committed.
      - name: Point changelog links at the public GitHub repo
        run: |
          sed -i \
            "s#https://gitea.xeusnguyen.xyz/platform-team/wxops-portal-v2#https://github.com/${{ github.repository }}#" \
            cliff.toml

      - name: Install git-cliff
        run: pip install git-cliff --break-system-packages

      - name: Regenerate CHANGELOG.md
        run: git-cliff -o CHANGELOG.md

      # Best-effort. GITHUB_TOKEN can push commits, but it cannot bypass a "require
      # pull request before merging" rule on main — so on a protected main this push
      # is refused. That must not sink the release (the CLI binaries and the GitHub
      # Release are created AFTER this step), and nothing is lost: CHANGELOG.md is
      # regenerated in full from git history on every release, so the next tag
      # picks it up. The refusal shows as a warning annotation on the run.
      - name: Commit and push updated files
        run: |
          git config user.name  "W'xOps Platform Bot"
          git config user.email "wxopsbot@wxops.cloud"
          git add CHANGELOG.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): update changelog for ${{ github.ref_name }}"
            git push origin HEAD:main || echo "::warning title=Changelog not pushed::Could not push CHANGELOG.md to main (branch protection, or main moved on since the tag). The release itself is unaffected; the next release regenerates the changelog."
          fi

      # ── Build CLI release binaries ───────────────────────────────────────────
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: cli/go.sum

      - name: Build CLI binaries
        run: |
          mkdir -p dist
          for GOOS in linux darwin; do
            for GOARCH in amd64 arm64; do
              GOOS=$GOOS GOARCH=$GOARCH go build \
                -ldflags="-X main.version=${{ github.ref_name }}" \
                -o dist/wxops-${GOOS}-${GOARCH} \
                ./cmd/wxops
            done
          done
        working-directory: cli

      # ── Publish release ──────────────────────────────────────────────────────

      - name: Build release body
        env:
          VERSION: ${{ github.ref_name }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          # Priority: version-specific file → template → raw cliff output.
          # Both version-specific files and template support the same placeholders:
          #   {{CLIFF_NOTES}}  auto-generated commit list for this tag
          #   {{VERSION}}      tag name (e.g. v1.2.0)
          #   {{IMAGE}}        full registry image path
          # Including {{CLIFF_NOTES}} in a version-specific file merges hand-written
          # notes with the auto-generated commit list.
          notes_file="release-notes/${VERSION}.md"
          if [ -f "$notes_file" ]; then
            source_file="$notes_file"
          elif [ -f "release-notes/template.md" ]; then
            source_file="release-notes/template.md"
          else
            source_file=""
          fi

          if [ -n "$source_file" ]; then
            git-cliff --current --strip all > /tmp/cliff-notes.md
            sed \
              -e "s|{{IMAGE}}|${IMAGE}|g" \
              -e "s|{{VERSION}}|${VERSION}|g" \
              -e '/{{CLIFF_NOTES}}/{' \
              -e 'r /tmp/cliff-notes.md' \
              -e 'd' \
              -e '}' \
              "$source_file" > /tmp/release-body.md
          else
            git-cliff --current --strip all > /tmp/release-body.md
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: /tmp/release-body.md
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          files: cli/dist/wxops-*
