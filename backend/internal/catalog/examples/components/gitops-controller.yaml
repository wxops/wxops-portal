apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: gitops-controller
  title: GitOps Controller
  description: ArgoCD instance managing continuous delivery — syncs gitops-infra manifests to all spoke clusters. Drives Crossplane resource provisioning and Kubernetes workload deployment.
  tags: [argocd, gitops, kubernetes]
  annotations:
    gitea/source-location: platform/gitops-infra
    jira/project-key: WXOPS
spec:
  type: service
  lifecycle: production
  owner: group:platform-team
  system: platform
  providesApis:
    - api:default/gitops-api
  consumesApis:
    - api:default/metrics-api
  dependsOn:
    - resource:default/gitops-infra-repo
    - resource:default/argocd-db
    - resource:default/platform-vault
