# Example: ExternalSecret for wxops-portal's required secret values, for
# teams already running External Secrets Operator against Vault (or another
# supported backend).
#
# NOT installed by this chart. If you don't already run ESO, use the
# `extraManifests` + `secretValues` example in values.yaml instead — it needs
# nothing beyond the chart itself. Reach for this one only if ESO is already
# part of your stack.
#
# Adjust before use:
#   - secretStoreRef.name must match a SecretStore/ClusterSecretStore you
#     already have configured — this does not create one.
#   - dataFrom.extract.key (or switch to explicit `data:` entries) must match
#     how your secret backend actually stores these values.
#   - After this reconciles into a real Secret, reference it from
#     portal.envFrom in your values.yaml:
#       portal:
#         envFrom:
#           - secretRef:
#               name: wxops-portal-secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wxops-portal-secrets
  namespace: wxops-system
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: wxops-portal-secrets
  dataFrom:
    - extract:
        key: wxops-portal
  # The extracted secret must supply exactly these two keys — matching what
  # the Deployment expects via env. Explicit form, if your backend needs it
  # instead of the dataFrom.extract shorthand above:
  # data:
  #   - secretKey: OIDC_CLIENT_SECRET
  #     remoteRef:
  #       key: wxops-portal
  #       property: oidc_client_secret
  #   - secretKey: SESSION_SECRET
  #     remoteRef:
  #       key: wxops-portal
  #       property: session_secret
