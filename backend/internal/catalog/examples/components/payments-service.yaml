apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: payments-service
  title: Payments Service
  description: Synchronous payment processing — exposes REST and gRPC APIs, writes to PostgreSQL, caches in Redis, reads secrets from Vault, and enqueues async jobs via NATS.
  tags: [go, grpc, rest, payments]
  annotations:
    gitea/source-location: platform/payments-service
    jira/project-key: PAY
  links:
    - url: https://gitea.example.com/platform/payments-service/src/branch/main/docs/runbook.md
      title: Runbook
      icon: dashboard
      type: documentation
    - url: https://gitea.example.com/platform/payments-service/src/branch/main/openapi.yaml
      title: OpenAPI Spec
      icon: api
      type: documentation
    - url: https://gitea.example.com/platform/architecture/src/branch/main/rfcs/rfc-001-kafka-for-payments-events.md
      title: "RFC-001: Kafka for Payments Events"
      icon: docs
      type: rfc
    - url: https://gitea.example.com/platform/architecture/src/branch/main/rfcs/rfc-002-vault-for-payment-secrets.md
      title: "RFC-002: Vault for Payment Secrets"
      icon: docs
      type: rfc
    - url: https://gitea.example.com/platform/architecture/src/branch/main/docs/adr/adr-001-kafka-for-payments-events.md
      title: "ADR-001: Kafka for Payments Events"
      icon: docs
      type: adr
    - url: https://gitea.example.com/platform/architecture/src/branch/main/docs/adr/adr-002-vault-for-payment-secrets.md
      title: "ADR-002: Vault for Payment Secrets"
      icon: docs
      type: adr
    - url: https://gitea.example.com/platform/architecture/src/branch/main/docs/adr/adr-003-redis-for-idempotency.md
      title: "ADR-003: Redis for Idempotency Keys"
      icon: docs
      type: adr
spec:
  type: service
  lifecycle: production
  owner: group:payments-team
  system: payments
  providesApis:
    - api:default/payments-api
    - api:default/payments-events
  consumesApis:
    - api:default/user-api
    - api:default/metrics-api
  dependsOn:
    - resource:default/payments-db
    - resource:default/payments-cache
    - resource:default/payments-vault
    - resource:default/payments-queue
