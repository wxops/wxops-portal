[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.
Versions follow [Semantic Versioning](https://semver.org/).
Commits follow [Conventional Commits](https://www.conventionalcommits.org/).

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{{ commit.message | upper_first }}\
{% if commit.breaking %} (**BREAKING**){% endif %}
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false

# Semver bump rules:
#   BREAKING CHANGE footer or ! in type  → major
#   feat                                  → minor
#   fix, perf                             → patch
commit_parsers = [
  { message = "^feat",                          group = "Features" },
  { message = "^fix",                           group = "Bug Fixes" },
  { message = "^perf",                          group = "Performance" },
  { message = "^refactor",                      group = "Refactoring" },
  { message = "^doc|^docs",                     group = "Documentation" },
  { message = "^style",                         group = "Styling" },
  { message = "^test",                          group = "Testing" },
  { message = "^ci",                            group = "CI" },
  { message = "^chore\\(release\\): prepare",   skip = true },
  { message = "^chore",                         group = "Chores" },
  { body = ".*security",                        group = "Security" },
]

# Only include commits since the last tag.
filter_commits = false

# Match tags like v0.1.0, v1.2.3, v1.0.0-alpha.1
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+.*"

# Skip pre-release tags from being treated as release boundaries when bumping.
# Add any bootstrap tags here if needed.
ignore_tags = ""

topo_order = false
sort_commits = "oldest"
